# docker-compose.yml — Full local development stack
# Usage: docker compose up -d

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://fte_user:fte_pass@postgres:5432/customer_fte
  DATABASE_URL_SYNC: postgresql://fte_user:fte_pass@postgres:5432/customer_fte
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  GROQ_API_KEY: ${GROQ_API_KEY}
  GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
  GROQ_MODEL: ${GROQ_MODEL:-llama3-70b-8192}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ENVIRONMENT: development
  LOG_LEVEL: INFO

services:
  # ── PostgreSQL with pgvector ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fte_user
      POSTGRES_PASSWORD: fte_pass
      POSTGRES_DB: customer_fte
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fte_user -d customer_fte"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fte-net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fte-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fte-net

  # ── FastAPI (Channel intake + REST API) ───────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: fte-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_WORKERS: "4"
      CORS_ORIGINS: "http://localhost:3000,http://webform:3000"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-ACxxxxxx}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-xxxxxx}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-whatsapp:+14155238886}
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fte-net

  # ── Agent Worker (Redis consumer) ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *common-env
    deploy:
      replicas: 2
    networks:
      - fte-net

  # ── Web Support Form (Next.js) ────────────────────────────────────────────
  webform:
    build:
      context: .
      dockerfile: docker/Dockerfile.webform
    container_name: fte-webform
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - fte-net

volumes:
  postgres_data:
  redis_data:

networks:
  fte-net:
    driver: bridge
