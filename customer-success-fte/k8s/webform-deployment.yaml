# k8s/webform-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fte-webform
  namespace: fte-system
  labels:
    app: fte-webform
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fte-webform
  template:
    metadata:
      labels:
        app: fte-webform
    spec:
      containers:
        - name: webform
          image: your-registry/fte-webform:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.yourapp.com"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.yourapp.com"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: fte-webform-svc
  namespace: fte-system
spec:
  selector:
    app: fte-webform
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
# k8s/ingress.yaml — nginx ingress with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fte-ingress
  namespace: fte-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support for /support/ws/
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - api.yourapp.com
        - app.yourapp.com
      secretName: fte-tls-secret
  rules:
    - host: api.yourapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fte-api-svc
                port:
                  number: 80
    - host: app.yourapp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fte-webform-svc
                port:
                  number: 80
