# k8s/worker-deployment.yaml
# Kafka consumer / AI agent worker — 5 replicas, HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fte-worker
  namespace: fte-system
  labels:
    app: fte-worker
    component: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: fte-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: fte-worker
        component: worker
    spec:
      terminationGracePeriodSeconds: 60   # allow in-flight agent run to finish
      containers:
        - name: worker
          image: your-registry/fte-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: fte-config
            - secretRef:
                name: fte-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fte-worker-hpa
  namespace: fte-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fte-worker
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
